syntax = "proto3";

package analytics;

service AnalyticsService {
  // Get portfolio analytics including PnL, allocation, and performance metrics
  rpc GetPortfolioAnalytics(GetPortfolioAnalyticsRequest) returns (GetPortfolioAnalyticsResponse);
  
  // Get PnL breakdown by asset
  rpc GetPnLBreakdown(GetPnLBreakdownRequest) returns (GetPnLBreakdownResponse);
  
  // Get asset allocation
  rpc GetAssetAllocation(GetAssetAllocationRequest) returns (GetAssetAllocationResponse);
}

message GetPortfolioAnalyticsRequest {
  string user_id = 1;
}

message GetPortfolioAnalyticsResponse {
  PortfolioAnalytics analytics = 1;
}

message PnLBreakdown {
  string symbol = 1;
  double realized_pnl = 2;
  double unrealized_pnl = 3;
  double total_pnl = 4;
  double quantity = 5;
  double average_cost = 6;
  double current_price = 7;
}

message AssetAllocation {
  string symbol = 1;
  double value = 2;
  double percentage = 3;
  double quantity = 4;
}

message PerformanceMetrics {
  double roi = 1;
  double sharpe_ratio = 2;
  double total_return = 3;
  double volatility = 4;
  double max_drawdown = 5;
  string start_date = 6;
  string end_date = 7;
}

message PortfolioAnalytics {
  string user_id = 1;
  double total_value = 2;
  double total_pnl = 3;
  repeated PnLBreakdown pnl_breakdown = 4;
  repeated AssetAllocation asset_allocation = 5;
  PerformanceMetrics performance_metrics = 6;
  string last_updated = 7;
}

message GetPnLBreakdownRequest {
  string user_id = 1;
}

message GetPnLBreakdownResponse {
  repeated PnLBreakdown pnl_breakdown = 1;
}

message GetAssetAllocationRequest {
  string user_id = 1;
}

message GetAssetAllocationResponse {
  repeated AssetAllocation asset_allocation = 1;
}
