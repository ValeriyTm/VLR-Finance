global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3000']
    metrics_path: '/metrics'

  - job_name: 'portfolio-service'
    static_configs:
      - targets: ['portfolio-service:3000']
    metrics_path: '/metrics'

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:3000']
    metrics_path: '/metrics'

  - job_name: 'ai-copilot-service'
    static_configs:
      - targets: ['ai-copilot-service:3000']
    metrics_path: '/metrics'

  - job_name: 'ingestor-service'
    static_configs:
      - targets: ['ingestor-service:3000']
    metrics_path: '/metrics'

  - job_name: 'background-jobs-service'
    static_configs:
      - targets: ['background-jobs-service:3000']
    metrics_path: '/metrics'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres-auth'
    static_configs:
      - targets: ['postgres-auth:5432']

  - job_name: 'postgres-portfolio'
    static_configs:
      - targets: ['postgres-portfolio:5432']

  - job_name: 'postgres-ai'
    static_configs:
      - targets: ['postgres-ai:5432']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
