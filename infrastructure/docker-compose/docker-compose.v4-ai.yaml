services:
  ai-copilot-service:
    build:
      context: ../../apps/ai-copilot-service
      dockerfile: Dockerfile
    container_name: vlr-ai-copilot-service
    ports:
      - "3007:3007"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-ai:5432/ai
      OLLAMA_URL: http://host.docker.internal:11434
      MEM0_URL: http://mem0:8080
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vlr-network
    depends_on:
      - postgres-ai

  ai-copilot-mf:
    build:
      context: ../../apps/ai-copilot-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-ai-copilot-mf
    ports:
      - "3008:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/ai
    networks:
      - vlr-network
    depends_on:
      - ai-copilot-service
