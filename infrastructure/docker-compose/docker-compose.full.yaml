services:
  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nestjs
    container_name: vlr-auth-service
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-auth:5432/auth
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    networks:
      - vlr-network
    depends_on:
      - postgres-auth
      - redis
      - kafka
      - rabbitmq

  auth-profile-mf:
    build:
      context: ../../apps/auth-profile-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-auth-profile-mf
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/auth
    networks:
      - vlr-network
    depends_on:
      - auth-service

  ingestor-service:
    build:
      context: ../../apps/ingestor-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nestjs
    container_name: vlr-ingestor-service
    ports:
      - "3003:3000"
    environment:
      KAFKA_BROKERS: kafka:29092
    networks:
      - vlr-network
    depends_on:
      - kafka

  terminal-mf:
    build:
      context: ../../apps/terminal-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-terminal-mf
    ports:
      - "3004:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/ingestor
      NEXT_PUBLIC_WS_URL: ws://localhost:80
    networks:
      - vlr-network
    depends_on:
      - ingestor-service

  portfolio-service:
    build:
      context: ../../apps/portfolio-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nestjs
    container_name: vlr-portfolio-service
    ports:
      - "3005:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-portfolio:5432/portfolio
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    networks:
      - vlr-network
    depends_on:
      - postgres-portfolio
      - redis
      - kafka
      - rabbitmq

  portfolio-mf:
    build:
      context: ../../apps/portfolio-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-portfolio-mf
    ports:
      - "3006:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/portfolio
    networks:
      - vlr-network
    depends_on:
      - portfolio-service

  ai-copilot-service:
    build:
      context: ../../apps/ai-copilot-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nestjs
    container_name: vlr-ai-copilot-service
    ports:
      - "3007:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-ai:5432/ai
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OLLAMA_URL: http://host.docker.internal:11434
      MEM0_URL: http://mem0:8080
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    networks:
      - vlr-network
    depends_on:
      - postgres-ai
      - redis
      - kafka
      - rabbitmq

  ai-copilot-mf:
    build:
      context: ../../apps/ai-copilot-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-ai-copilot-mf
    ports:
      - "3008:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/ai
    networks:
      - vlr-network
    depends_on:
      - ai-copilot-service

  background-jobs-service:
    build:
      context: ../../apps/background-jobs-service
      dockerfile: ../../infrastructure/docker/Dockerfile.nestjs
    container_name: vlr-background-jobs-service
    ports:
      - "3009:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-portfolio:5432/portfolio
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    networks:
      - vlr-network
    depends_on:
      - postgres-portfolio
      - redis
      - minio
