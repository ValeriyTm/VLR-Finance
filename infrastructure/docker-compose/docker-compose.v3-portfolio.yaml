services:
  portfolio-service:
    build:
      context: ../../apps/portfolio-service
      dockerfile: Dockerfile
    container_name: vlr-portfolio-service
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-portfolio:5432/portfolio
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    networks:
      - vlr-network
    depends_on:
      - postgres-portfolio
      - redis
      - kafka

  analytics-service:
    build:
      context: ../../apps/analytics-service
      dockerfile: Dockerfile
    container_name: vlr-analytics-service
    ports:
      - "3006:3005"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    networks:
      - vlr-network
    depends_on:
      - clickhouse

  portfolio-mf:
    build:
      context: ../../apps/portfolio-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-portfolio-mf
    ports:
      - "3007:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/portfolio
    networks:
      - vlr-network
    depends_on:
      - portfolio-service
      - analytics-service
