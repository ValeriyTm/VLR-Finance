services:
  # PostgreSQL - Auth Database
  postgres-auth:
    image: postgres:16-alpine
    container_name: vlr-postgres-auth
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Portfolio Database
  postgres-portfolio:
    image: postgres:16-alpine
    container_name: vlr-postgres-portfolio
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-portfolio-data:/var/lib/postgresql/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - AI Database with pgvector
  postgres-ai:
    image: pgvector/pgvector:pg16
    container_name: vlr-postgres-ai
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: vlr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vlr-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - vlr-network

  # ksqlDB
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: vlr-ksqldb
    depends_on:
      - kafka
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_STATUS_STORAGE_TOPIC: "docker-ksql-status"
      KSQL_KSQL_SERVICE_ID: "ksqldb_analytics_cluster_"
      KSQL_KSQL_STREAMS_PROCESSING_GUARANTEE: "at_least_once"
      KSQL_KSQL_COMMAND_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TRANSIENT_QUERIES_RECOVERY_LOG_REPLICATION_FACTOR: 1
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "false"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "false"
      KSQL_KSQL_HIDDEN_TOPICS_ENABLE: "false"
    networks:
      - vlr-network

  # ksqlDB CLI
  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: vlr-ksqldb-cli
    depends_on:
      - ksqldb-server
    entrypoint: /bin/sh
    tty: true
    networks:
      - vlr-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: vlr-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO
  minio:
    # image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: vlr-minio
    command: server /data --console-address ":9001"
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    ports:
      - "9002:9000" # Адрес до самого S3-хранилища
      - "9001:9001" # Адрес к UI для доступа к хранилищу (вход с юзером/паролем minioadmin/minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO init
  minio-init:
    # image: minio/mc:latest
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: vlr-minio-init
    # depends_on:
    #   - minio
    depends_on:
      minio:                      
        condition: service_healthy
    # entrypoint: >
    #   /bin/sh -c "
    #   until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 2; done;
    #   /usr/bin/mc mb --ignore-existing myminio/logs-bucket || true;
    #   /usr/bin/mc mb --ignore-existing myminio/images-bucket || true;
    #   exit 0;
    #   "
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/logs-bucket || true;
      mc mb --ignore-existing myminio/images-bucket || true;
      exit 0;
      "
    networks:
      - vlr-network

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: vlr-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../scripts/init-clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Debezium (Kafka Connect)
  debezium:
    image: debezium/connect:2.5
    container_name: vlr-debezium
    depends_on:
      - kafka
      - postgres-auth
      - postgres-portfolio
      - postgres-ai
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: compose-connect-group
      CONFIG_STORAGE_TOPIC: docker-connect-configs
      OFFSET_STORAGE_TOPIC: docker-connect-offsets
      STATUS_STORAGE_TOPIC: docker-connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    volumes:
      - ../scripts/debezium-connectors:/kafka/connect/debezium-connectors
    networks:
      - vlr-network

  # Vector
  vector:
    image: timberio/vector:0.36.0-alpine
    container_name: vlr-vector
    ports:
      - "8686:8686"
    volumes:
      - ../docker/vector.toml:/etc/vector/vector.toml
      - /var/log:/var/log
    networks:
      - vlr-network
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: vlr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - vlr-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: vlr-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - vlr-network
    depends_on:
      - prometheus

  # Grafana Tempo
  tempo:
    image: grafana/tempo:latest
    container_name: vlr-tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../docker/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    networks:
      - vlr-network

  # Grafana Loki
  loki:
    image: grafana/loki:latest
    container_name: vlr-loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../docker/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - vlr-network

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: vlr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - vlr-network
    depends_on:
      - postgres-auth
      - postgres-portfolio
      - postgres-ai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  vlr-network:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-portfolio-data:
  postgres-ai-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
  minio-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
