services:
  # PostgreSQL - Auth Database
  postgres-auth:
    image: postgres:16-alpine
    container_name: vlr-postgres-auth
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Portfolio Database
  postgres-portfolio:
    image: postgres:16-alpine
    container_name: vlr-postgres-portfolio
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-portfolio-data:/var/lib/postgresql/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - AI Database with pgvector
  postgres-ai:
    image: pgvector/pgvector:pg16
    container_name: vlr-postgres-ai
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: vlr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vlr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - vlr-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vlr-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ksqlDB
  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:7.5.0
    container_name: vlr-ksqldb
    depends_on:
      - kafka
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "kafka:9092"
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    networks:
      - vlr-network

  # ksqlDB CLI
  ksqldb-cli:
    image: confluentinc/cp-ksqldb-cli:7.5.0
    container_name: vlr-ksqldb-cli
    depends_on:
      - ksqldb-server
    entrypoint: /bin/sh
    tty: true
    networks:
      - vlr-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: vlr-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO
  minio:
    image: quay.io/minio/minio:latest
    container_name: vlr-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: vlr-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../scripts/init-clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh
    networks:
      - vlr-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Debezium (Kafka Connect)
  debezium:
    image: debezium/connect:2.5
    container_name: vlr-debezium
    depends_on:
      - kafka
      - postgres-auth
      - postgres-portfolio
      - postgres-ai
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    volumes:
      - ../scripts/debezium-connectors:/kafka/connect/debezium-connectors
    networks:
      - vlr-network

  # Vector
  vector:
    image: timberio/vector:0.34.0-alpine
    container_name: vlr-vector
    ports:
      - "8686:8686"
    volumes:
      - ../docker/vector.toml:/etc/vector/vector.toml
      - /var/log:/var/log
    networks:
      - vlr-network
    command: ["vector", "watch"]

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: vlr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - vlr-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: vlr-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - vlr-network
    depends_on:
      - prometheus

  # Grafana Tempo
  tempo:
    image: grafana/tempo:latest
    container_name: vlr-tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../docker/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    networks:
      - vlr-network

  # Grafana Loki
  loki:
    image: grafana/loki:latest
    container_name: vlr-loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../docker/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - vlr-network

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: vlr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - vlr-network
    depends_on:
      - postgres-auth
      - postgres-portfolio
      - postgres-ai
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  vlr-network:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-portfolio-data:
  postgres-ai-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  rabbitmq-data:
  minio-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
