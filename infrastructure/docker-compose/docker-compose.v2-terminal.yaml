services:
  ingestor-service:
    build:
      context: ../../apps/ingestor-service
      dockerfile: Dockerfile
    container_name: vlr-ingestor-service
    ports:
      - "3003:3003"
    environment:
      KAFKA_BROKERS: kafka:29092
      MOCK_STRATEGY: "true"
      SYMBOLS: btcusdt,ethusdt
      MOCK_INTERVAL: 1000
      BINANCE_WS_URL: wss://stream.binance.com:9443/ws
      MAX_RECONNECT_ATTEMPTS: 10
      RECONNECT_INTERVAL: 5000
    networks:
      - vlr-network
    depends_on:
      - kafka

  terminal-mf:
    build:
      context: ../../apps/terminal-mf
      dockerfile: ../../infrastructure/docker/Dockerfile.nextjs
    container_name: vlr-terminal-mf
    ports:
      - "3004:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api/ingestor
      NEXT_PUBLIC_WS_URL: ws://localhost:80
    networks:
      - vlr-network
    depends_on:
      - ingestor-service
